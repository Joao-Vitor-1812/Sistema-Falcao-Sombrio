<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GCS - Autenticação Tática</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #32CD32;
            --alert-color: #ff4444;
            --font-mono: 'JetBrains Mono', 'Roboto Mono', monospace;
        }
        body {
            background-color: var(--bg-color); color: var(--accent-color); font-family: var(--font-mono);
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
            background-image: radial-gradient(circle, #111 1px, transparent 1px); background-size: 20px 20px;
        }
        .login-box {
            background: #0a0a0a; border: 1px solid var(--accent-color); padding: 40px;
            width: 350px; text-align: center; box-shadow: 0 0 15px rgba(50, 205, 50, 0.2);
        }
        h1 { font-size: 1.2rem; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; letter-spacing: 2px; }
        input {
            width: 90%; padding: 10px; margin: 10px 0; background: #000; border: 1px solid #333;
            color: var(--accent-color); font-family: var(--font-mono); outline: none;
        }
        input:focus { border-color: var(--accent-color); }
        button {
            width: 95%; padding: 12px; margin-top: 15px; background: var(--accent-color);
            color: #000; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-family: var(--font-mono);
        }
        button:hover { background: #28a428; }
        
        /* Estilos do MFA */
        #mfa-section { display: none; }
        .mfa-alert { color: var(--alert-color); font-size: 0.85rem; margin-bottom: 15px; border: 1px dashed var(--alert-color); padding: 10px; }
        
        input[type="file"] { display: none; }
        .file-upload-btn {
            background: #222; border: 1px solid var(--alert-color); color: var(--alert-color);
            padding: 10px; display: inline-block; cursor: pointer; width: 90%; text-transform: uppercase; font-size: 0.8rem;
        }
        .file-upload-btn:hover { background: var(--alert-color); color: #000; }
        #file-name-display { font-size: 0.7rem; color: #888; margin-top: 10px; display: block; }

        /* Mensagem de bloqueio tático */
        #msg-bloqueio {
            color: var(--alert-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            border: 1px dashed var(--alert-color);
            padding: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>SECURUS DYNAMICS</h1>
        
        <form id="login-form" onsubmit="event.preventDefault();">
            <div id="login-section">
                <p style="font-size: 0.8rem; color: #aaa;">IDENTIFICAÇÃO DE OPERADOR</p>
                <input type="text" id="username" placeholder="LOGIN" autocomplete="off" required>
                <input type="password" id="password" placeholder="SENHA" required>
                <button type="button" onclick="verificarMFA()">Autenticar</button>
                <p id="error-msg" style="color: var(--alert-color); font-size: 0.8rem; display: none;"></p>
            </div>

            <div id="mfa-section">
                <div class="mfa-alert">
                    <strong>PROTOCOLO MFA EXIGIDO</strong><br>
                    Insira a Chave de Segurança USB
                </div>
                
                <label class="file-upload-btn">
                    SELECIONAR ARQUIVO CHAVE (.key)
                    <input type="file" id="hardware-key-file" accept=".key" onchange="lerArquivoKey()">
                </label>
                <span id="file-name-display">Nenhum hardware detectado.</span>
                
                <button type="button" onclick="enviarLoginMFA()" id="btn-finalizar" style="display:none; background: var(--alert-color);">Desbloquear Sistema</button>
                
                <div id="msg-bloqueio">TERMINAL BLOQUEADO: Múltiplos Erros de Chave</div>
            </div>
        </form>
    </div>

    <script>
        let chaveLidaDoPendrive = null;
        let loginTemporario = "";
        let senhaTemporaria = "";

        // Mantém a persistência do bloqueio caso a página seja atualizada
        document.addEventListener("DOMContentLoaded", () => {
            const errosSalvos = parseInt(sessionStorage.getItem('mfa_errors')) || 0;
            if (errosSalvos >= 2) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('mfa-section').style.display = 'block';
                document.getElementById('btn-finalizar').style.display = 'none';
                document.getElementById('msg-bloqueio').style.display = 'block';
            }
        });

        function verificarMFA() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            if (user === "" || pass === "") {
                alert("Por favor, preencha o login e a senha.");
                return;
            }

            // Retém os dados do input em memória antes de mudar as abas visíveis
            loginTemporario = user;
            senhaTemporaria = pass;

            document.getElementById('login-section').style.display = 'none';
            document.getElementById('mfa-section').style.display = 'block';
        }

        function lerArquivoKey() {
            const fileInput = document.getElementById('hardware-key-file');
            const file = fileInput.files[0];
            
            if (file) {
                document.getElementById('file-name-display').innerText = "Lendo Hardware: " + file.name;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    chaveLidaDoPendrive = e.target.result.trim();
                    document.getElementById('btn-finalizar').style.display = 'block';
                    document.getElementById('file-name-display').style.color = "var(--accent-color)";
                    document.getElementById('file-name-display').innerText = "Assinatura Criptográfica Extraída com Sucesso.";
                };
                reader.readAsText(file);
            }
        }

        async function enviarLoginMFA() {
            let errosAtuais = parseInt(sessionStorage.getItem('mfa_errors')) || 0;

            if (errosAtuais >= 2) {
                document.getElementById('btn-finalizar').style.display = 'none';
                document.getElementById('msg-bloqueio').style.display = 'block';
                return;
            }

            // Garante o envio do payload estável contendo as credenciais retidas
            const payload = {
                username: loginTemporario,
                password: senhaTemporaria,
                hardwareKey: chaveLidaDoPendrive
            };

            try {
                const response = await fetch('/api/auth/mfa-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const operadorLogado = await response.text();
                    sessionStorage.removeItem('mfa_errors'); 
                    sessionStorage.setItem('operadorLogado', operadorLogado);
                    window.location.href = 'index.html'; 
                } else {
                    const errorText = await response.text();
                    errosAtuais++;
                    sessionStorage.setItem('mfa_errors', errosAtuais);

                    if (errosAtuais >= 2) {
                        document.getElementById('btn-finalizar').style.display = 'none';
                        document.getElementById('msg-bloqueio').style.display = 'block';
                        alert("FALHA CRÍTICA: " + errorText + " Terminal bloqueado após 2 tentativas.");
                    } else {
                        alert(`MFA INVÁLIDO: Assinatura de hardware incorreta. (Tentativa ${errosAtuais} de 2)`);
                        document.getElementById('hardware-key-file').value = "";
                        document.getElementById('file-name-display').style.color = "#888";
                        document.getElementById('file-name-display').innerText = "Insira um dispositivo de hardware válido.";
                        document.getElementById('btn-finalizar').style.display = 'none';
                    }
                }
            } catch (err) {
                alert("Erro de comunicação com o servidor.");
            }
        }
    </script>
</body>
</html>
